    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  </style>

    // PRNG
    function cyrb128(str){
      let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
      for(let i=0;i<str.length;i++){
        let k=str.charCodeAt(i);
        h1=h2^Math.imul(h1^k,597399067);
        h2=h3^Math.imul(h2^k,2869860233);
        h3=h4^Math.imul(h3^k,951274213);
        h4=h1^Math.imul(h4^k,2716044179);
      }
      h1=Math.imul(h3^(h1>>>18),597399067);
      h2=Math.imul(h4^(h2>>>22),2869860233);
      h3=Math.imul(h1^(h3>>>17),951274213);
      h4=Math.imul(h2^(h4>>>19),2716044179);
      return [(h1^h2^h3^h4)>>>0];
    }
    function mulberry32(a){
      return function(){
        let t=a+=0x6D2B79F5;
        t=Math.imul(t^(t>>>15), t|1);
        t^=t+Math.imul(t^(t>>>7), t|61);
        return ((t^(t>>>14))>>>0)/4294967296;
      };
    }
    function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)] }
    function shuffle(rng, arr){
      const a = arr.slice();
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(rng()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }

    // Extract text from file
    async function readFileText(file){
      if(!file) return "";
      if (file.type === "text/plain") return (await file.text()).slice(0,150000);
      if (file.type === "application/pdf"){
        const buf = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({data:buf}).promise;
        const max = Math.min(pdf.numPages, 12);
        let out="";
        for(let p=1;p<=max;p++){
          const page=await pdf.getPage(p);
          const txt=await page.getTextContent();
          out+=txt.items.map(it=>it.str).join(" ")+"\n";
          if(out.length>150000) break;
        }
        return out.slice(0,150000);
      }
      if (file.name.toLowerCase().endsWith(".docx")){
        const ab = await file.arrayBuffer();
        const r = await window.mammoth.extractRawText({arrayBuffer:ab});
        return (r.value||"").slice(0,150000);
      }
      return "";

    // Keyword extraction, with lightweight normalization
    function keyTerms(text, max=18){
      const t=(text||"")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9\s]/g," ")
        .split(/\s+/)
        .filter(w => w.length>=4 && !stop.has(w));
      const f = new Map();
      for(const w of t) f.set(w,(f.get(w)||0)+1);
      return Array.from(f.entries()).sort((a,b)=>b[1]-a[1]).slice(0,max).map(([w])=>w);
    }

    ]);

          ops:["logistica","logística","recoleccion","recolección","clasificacion","clasificación","transporte","inventario","trazabilidad","calidad","seguridad","estandares","estándares"],
          market:["mercado","ventas","precios","canales","clientes","marca","comunicacion","comunicación","plataforma","ecommerce","e-commerce"],
          people:["mujeres","women","jovenes","jóvenes","comunidad","colectivo","empleo","ingresos","formacion","formación","capacidades","emprendimiento"],
          climate:["clima","adaptacion","adaptación","resiliencia","mitigacion","mitigación","emisiones"]
        }
      };

      const dict = map[lang] || map.pt;
      const buckets = {circular:[],ops:[],market:[],people:[],climate:[]};
      for(const w of t){
        for(const k of Object.keys(buckets)){
          if(dict[k].includes(w)) buckets[k].push(w);
        }
      }

      const fallback = {
        pt:["coleta e triagem","reparo e reúso","qualidade e rastreabilidade","precificação e canais","formação e mentoria","monitoramento e evidências","governança local"],
        en:["collection and sorting","repair and reuse","quality and traceability","pricing and channels","training and mentoring","monitoring and evidence","local governance"],
        es:["recolección y clasificación","reparación y reuso","calidad y trazabilidad","precios y canales","formación y mentoría","monitoreo y evidencias","gobernanza local"]
      }[lang] || fallback.pt;

      const chosen = [];
      const order = shuffle(rng, ["circular","ops","market","people","climate"]);
      for(const k of order){
        if(chosen.length>=4) break;
        if(buckets[k].length){
          const w = buckets[k][0];
          chosen.push(humanizeTheme(w, lang));
        }
      }
      while(chosen.length<4) chosen.push(pick(rng, fallback));
      return chosen.slice(0,4);
    }

    function humanizeTheme(term, lang){
      const t = term.toLowerCase();
      const H = {
        pt:{
          "reparo":"reparo e manutenção",
          "reparacao":"reparo e manutenção",
          "reparação":"reparo e manutenção",
          "triagem":"triagem e classificação",
          "coleta":"coleta e consolidação",
          "rastreabilidade":"rastreabilidade e registros",
          "qualidade":"controle de qualidade",
          "precificacao":"precificação e margem",
          "precificação":"precificação e margem",
          "logistica":"logística e roteirização",
          "logística":"logística e roteirização",
          "ecommerce":"e-commerce e canais digitais",
          "e-commerce":"e-commerce e canais digitais",
          "capacitacao":"formação prática",
          "capacitação":"formação prática",
          "resiliencia":"resiliência local",
          "resiliência":"resiliência local"
        },
        en:{
          "repair":"repair and maintenance",
          "sorting":"sorting and grading",
          "collection":"collection and consolidation",
          "traceability":"traceability and records",
          "quality":"quality control",
          "pricing":"pricing and margins",
          "logistics":"logistics and routing",
          "ecommerce":"e-commerce and digital channels",
          "training":"hands on training",
          "resilience":"local resilience"
        },
        es:{
          "reparacion":"reparación y mantenimiento",
          "reparación":"reparación y mantenimiento",
          "clasificacion":"clasificación y control",
          "clasificación":"clasificación y control",
          "recoleccion":"recolección y consolidación",
          "recolección":"recolección y consolidación",
          "trazabilidad":"trazabilidad y registros",
          "calidad":"control de calidad",
          "precios":"precios y márgenes",
          "logistica":"logística y rutas",
          "logística":"logística y rutas",
          "ecommerce":"e-commerce y canales digitales",
          "formacion":"formación práctica",
          "formación":"formación práctica",
          "resiliencia":"resiliencia local"
        }
      };
      const dict = H[lang] || H.pt;
      return dict[t] || term;
    }

    // Rounded targets
    function roundPct(n){ return Math.max(50, Math.min(95, Math.round(n/5)*5)); }
    function round10(n){ return Math.max(30, Math.round(n/10)*10); }

    function computeBaseScale(durationMonths, nObjectives){
      const d = Math.max(1, Math.min(60, durationMonths));
      const o = Math.max(1, Math.min(6, nObjectives || 1));
      return 0.8 + (d/12) * 0.9 + (o-1)*0.08;
    }

    // Timeline, uses months and returns round ranges
    function timelinePhases(durationMonths, lang){
      const M = Math.max(1, Math.min(60, durationMonths));
      const m1 = Math.max(1, Math.round(M*0.25));
      const m2 = Math.max(m1+1, Math.round(M*0.70));
      const p1 = {s:1,e:m1};
      const p2 = {s:m1+1,e:m2};
      const p3 = {s:m2+1,e:M};
      const fmt = (p) => {
        if(lang==="en") return `Months ${p.s} to ${p.e}`;
        if(lang==="es") return `Meses ${p.s} a ${p.e}`;
        return `Meses ${p.s} a ${p.e}`;
      };
      return { plan:fmt(p1), impl:fmt(p2), close:fmt(p3) };
    }

    // Indicators, picks 2 per result, with round numbers
    function indicatorsFor(resultTitle, themes, lang, rng, baseScale){
      const B = BANK[lang];
      const pct1 = roundPct(70 + rng()*20 + baseScale*6);
      const pct2 = roundPct(60 + rng()*25 + baseScale*5);
      const sat  = roundPct(65 + rng()*20);
      const participants = round10(90 + rng()*120 + baseScale*40);

      const pool = [
        {
          texto: lang==="en" ? `Percentage of planned outputs delivered for ${resultTitle.toLowerCase()}`
                : lang==="es" ? `Porcentaje de productos planificados entregados para ${resultTitle.toLowerCase()}`
                : `Percentual de entregas concluídas para ${resultTitle.toLowerCase()}`,
          meta: `>= ${pct1}%`,
          meios_verificacao: B.movBase
        },
        {
          texto: lang==="en" ? `Percentage of participating groups applying new routines in practice`
                : lang==="es" ? `Porcentaje de grupos participantes aplicando nuevas rutinas en la práctica`
                : `Percentual de grupos participantes aplicando novas rotinas na prática`,
          meta: `>= ${pct2}%`,
          meios_verificacao: B.movBase
        },
        {
          texto: lang==="en" ? `Number of participants reached through training and mentoring activities`
                : lang==="es" ? `Número de participantes alcanzados mediante formación y mentoría`
                : `Número de participantes alcançados por formação e mentoria`,
          meta: `>= ${participants}`,
          meios_verificacao: B.movPart
        },
        {
          texto: lang==="en" ? `Satisfaction rate among participants regarding the support provided`
                : lang==="es" ? `Índice de satisfacción de participantes sobre el apoyo recibido`
                : `Índice de satisfação de participantes sobre o apoio recebido`,
          meta: `>= ${sat}%`,
          meios_verificacao: B.movPart
        }
      ];

      const idxs = shuffle(rng, [0,1,2,3]).slice(0,2);
      return idxs.map(i => pool[i]);
    }

    // Results and activities, never echo OE title string, only uses themes
    function buildResultsAndActivities(themes, durationMonths, lang, rng, baseScale){
      const B = BANK[lang];
      const phases = timelinePhases(durationMonths, lang);

      const resultsCount = 3;
      const actsPerResult = 4;

      const resultTitles = shuffle(rng, B.resultTitles).slice(0, resultsCount);
      const resultFrames = shuffle(rng, B.resultFrames);
      const actFrames = shuffle(rng, B.actFrames);
      const actTitles = shuffle(rng, B.actTitles);
      const logicPool = B.logicPool;

      const out = [];
      for(let r=0;r<resultsCount;r++){
        const tA = themes[(r*2) % themes.length];
        const tB = themes[(r*2+1) % themes.length];

        const rTitle = resultTitles[r];
        const rText  = resultFrames[r % resultFrames.length](tA, tB);

        const indicators = indicatorsFor(rTitle, themes, lang, rng, baseScale);

        const activities = [];
        const usedATitles = new Set();
        for(let a=0;a<actsPerResult;a++){
          const aA = themes[(r+a) % themes.length];
          const aB = themes[(r+a+1) % themes.length];

          let title = actTitles[(r*actsPerResult + a) % actTitles.length];
          while(usedATitles.has(title)) title = pick(rng, actTitles);
          usedATitles.add(title);

          const desc = actFrames[(r*actsPerResult + a) % actFrames.length](aA, aB);
          const log  = pick(rng, logicPool);

          const prazo = (a===0) ? phases.plan : (a<=2) ? phases.impl : phases.close;
          const mv    = (a===0 || a===2) ? B.movBase : B.movPart;

          activities.push({
            titulo: title,
            descricao: desc,
            logica_intervencao: log,
            prazo,
            meios_verificacao: mv
          });
        }

        out.push({
          titulo: rTitle,
          descricao: rText,
          indicadores: indicators,
          atividades: activities
        });
      }
      return out;
    }

    // Overall objective, uses project name and extracted context, without reusing OE titles
    function buildOverallObjective(nome, desc, edital, lang, rng){
      const B = BANK[lang];
      const terms = keyTerms(desc + " " + edital, 16);

      const territ = pick(rng, B.territ);
      const publico = pick(rng, B.publico);
      const metodo = pick(rng, B.metodo);

      const focus = terms.slice(0,4).join(", ");
      const frame = pick(rng, B.ogFrames);

      if(focus){
        const add = (lang==="en")
          ? ` Focus areas include ${focus}.`
          : (lang==="es")
            ? ` Áreas de foco incluyen ${focus}.`
            : ` Áreas de foco incluem ${focus}.`;
        return frame(clean(nome), territ, publico, metodo) + add;
      }
      return frame(clean(nome), territ, publico, metodo);
    }

    function generateML(nome, desc, oes, edital, lang, durationMonths){
      const seed = cyrb128(nome+"|"+desc+"|"+(oes||[]).map(o=>o.titulo).join("|")+"|"+lang+"|"+durationMonths)[0];
      const rng = mulberry32(seed);
      const baseScale = computeBaseScale(durationMonths, (oes||[]).length);

      const objetivo_geral = buildOverallObjective(nome, desc, edital, lang, rng);

      const objetivos_especificos = (oes||[]).map((oe,idx)=>{
        const titulo = clean(oe.titulo || `OE ${idx+1}`);
        const themes = buildThemes(desc, edital, titulo, oe.foco || "", lang, rng);
        const resultados = buildResultsAndActivities(themes, durationMonths, lang, rng, baseScale);
        return { numero: oe.numero||idx+1, titulo, temas: themes, resultados };
      });

      return { objetivo_geral, objetivos_especificos, duracao_meses: durationMonths };
    }

    // Preview
    function renderPreview(ml, lang){
      const L = LABEL[lang];
      const tb = document.querySelector('#tbl tbody'); tb.innerHTML="";
      const push=(k,v)=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td><b>${k}</b></td><td>${v||''}</td>`; tb.appendChild(tr); };

      const dur = (lang==="en") ? `Project duration: ${ml.duracao_meses} months`
                : (lang==="es") ? `Duración del proyecto: ${ml.duracao_meses} meses`
                : `Duração do projeto: ${ml.duracao_meses} meses`;

      push(L.geral, ml.objetivo_geral + "\n\n" + dur);

      (ml.objetivos_especificos||[]).forEach((oe,idx)=>{
        push(L.oe(oe.numero||idx+1), oe.titulo);

        if(oe.temas?.length){
          const themesLine = (lang==="en") ? `Themes: ${oe.temas.join(", ")}`
                           : (lang==="es") ? `Temas: ${oe.temas.join(", ")}`
                           : `Temas: ${oe.temas.join(", ")}`;
          push("", themesLine);
        }

        push("", `\n${L.resultados}`);
        (oe.resultados||[]).forEach((r)=>{
          push("", `\n${r.titulo}\n${r.descricao}`);
          push(L.indic, "");
          (r.indicadores||[]).forEach(ind=>{
            push("•", `${ind.texto}\n${L.meta}: ${ind.meta}\n${L.mov}: ${joinMV(ind.meios_verificacao)}`);
          });
        });

        push("", `\n${L.ativ}`);
        (oe.resultados||[]).forEach(r=>{
          (r.atividades||[]).forEach(a=>{
            push("•", `${a.titulo}\n${L.desc}: ${a.descricao}\n${L.log}: ${a.logica_intervencao}\n${L.prazo}: ${a.prazo}\n${L.mov}: ${joinMV(a.meios_verificacao)}`);
          });
        });
      });

      document.getElementById('previewBox').style.display='block';
    }

    // XLSX
    function baixarXlsx(ml, nomeProjeto, lang){
      const L = LABEL[lang];
      const wb = XLSX.utils.book_new();

      const dur = (lang==="en") ? `Project duration: ${ml.duracao_meses} months`
                : (lang==="es") ? `Duración del proyecto: ${ml.duracao_meses} meses`
                : `Duração do projeto: ${ml.duracao_meses} meses`;

      const aoa = [
        [ "MARCO LÓGICO" ],
        [ L.geral, (ml.objetivo_geral||"") + "\n\n" + dur ]
      ];

      (ml.objetivos_especificos||[]).forEach((oe,idx)=>{
        aoa.push([ L.oe(oe.numero||idx+1), oe.titulo ]);
        if(oe.temas?.length){
          const t = (lang==="en") ? `Themes: ${oe.temas.join(", ")}`
                  : (lang==="es") ? `Temas: ${oe.temas.join(", ")}`
                  : `Temas: ${oe.temas.join(", ")}`;
          aoa.push([ "", t ]);
        }

        aoa.push(["", L.resultados, "Descrição", L.indic, L.meta, L.mov ]);
        (oe.resultados||[]).forEach(r=>{
          const inds=r.indicadores||[];
          for(let i=0;i<inds.length;i++){
            const ind=inds[i];
            aoa.push([
              "",
              i===0 ? r.titulo : "",
              i===0 ? r.descricao : "",
              ind.texto,
              ind.meta,
              joinMV(ind.meios_verificacao)
            ]);
          }
        });

        aoa.push(["", L.ativ, L.desc, L.log, L.prazo, L.mov ]);
        (oe.resultados||[]).forEach(r=>{
          (r.atividades||[]).forEach(a=>{
            aoa.push(["", a.titulo, a.descricao, a.logica_intervencao, a.prazo, joinMV(a.meios_verificacao)]);
          });
        });
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols']=[{wch:26},{wch:34},{wch:54},{wch:54},{wch:16},{wch:44}];
      XLSX.utils.book_append_sheet(wb, ws, "Marco Lógico");
      const safe=(nomeProjeto||'Projeto').replace(/[^a-zA-Z0-9]/g,'_').slice(0,30);
      XLSX.writeFile(wb, `Marco_Logico_${safe}_${Date.now()}.xlsx`);
    }

    // DOCX
    async function baixarDocx(ml, nomeProjeto, lang){
      const { Document, Paragraph, TextRun, HeadingLevel, Packer } = window.docx;
      const L = LABEL[lang];

      const dur = (lang==="en") ? `Project duration: ${ml.duracao_meses} months`
                : (lang==="es") ? `Duración del proyecto: ${ml.duracao_meses} meses`
                : `Duração do projeto: ${ml.duracao_meses} meses`;

      const children = [];
      children.push(new Paragraph({ text: "MARCO LÓGICO", heading: HeadingLevel.HEADING_1 }));
      children.push(new Paragraph({ text: L.geral, heading: HeadingLevel.HEADING_2 }));
      children.push(new Paragraph(ml.objetivo_geral||""));
      children.push(new Paragraph(dur));

      (ml.objetivos_especificos||[]).forEach((oe,idx)=>{
        children.push(new Paragraph({ text: `${L.oe(oe.numero||idx+1)}: ${oe.titulo}`, heading: HeadingLevel.HEADING_2 }));

        if(oe.temas?.length){
          const t = (lang==="en") ? `Themes: ${oe.temas.join(", ")}`
                  : (lang==="es") ? `Temas: ${oe.temas.join(", ")}`
                  : `Temas: ${oe.temas.join(", ")}`;
          children.push(new Paragraph(t));
        }

        children.push(new Paragraph({ text: L.resultados, heading: HeadingLevel.HEADING_3 }));
        (oe.resultados||[]).forEach((r)=>{
          children.push(new Paragraph({ text: r.titulo, heading: HeadingLevel.HEADING_4 }));
          children.push(new Paragraph(r.descricao || ""));
          children.push(new Paragraph({ text: L.indic, heading: HeadingLevel.HEADING_5 }));
          (r.indicadores||[]).forEach((ind)=>{
            children.push(new Paragraph(new TextRun(`• ${ind.texto}`)));
            children.push(new Paragraph(new TextRun(`${L.meta}: ${ind.meta}`)));
            children.push(new Paragraph(new TextRun(`${L.mov}: ${joinMV(ind.meios_verificacao)}`)));
          });
        });

        children.push(new Paragraph({ text: L.ativ, heading: HeadingLevel.HEADING_3 }));
        (oe.resultados||[]).forEach((r)=>{
          (r.atividades||[]).forEach((a)=>{
            children.push(new Paragraph({ text: a.titulo, heading: HeadingLevel.HEADING_4 }));
            children.push(new Paragraph(new TextRun(`${L.desc}: ${a.descricao}`)));
            children.push(new Paragraph(new TextRun(`${L.log}: ${a.logica_intervencao}`)));
            children.push(new Paragraph(new TextRun(`${L.prazo}: ${a.prazo}`)));
            children.push(new Paragraph(new TextRun(`${L.mov}: ${joinMV(a.meios_verificacao)}`)));
          });
        });
      });

      const doc = new Document({ sections:[{ children }] });
      const blob = await Packer.toBlob(doc);
      const safe=(nomeProjeto||'Projeto').replace(/[^a-zA-Z0-9]/g,'_').slice(0,30);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Marco_Logico_${safe}_${Date.now()}.docx`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    }

    // Submit, webhook, and local generation
    const frm=document.getElementById('frm');
    const statusEl=document.getElementById('status');
    const diagBox=document.getElementById('diagBox');
    const dlX=document.getElementById('dlXlsx');
    const dlD=document.getElementById('dlDocx');
    let lastML=null, lastLang="pt";

    dlX.addEventListener('click', ()=>{ if(lastML) baixarXlsx(lastML, document.getElementById('nomeProjeto').value, lastLang); });
    dlD.addEventListener('click', ()=>{ if(lastML) baixarDocx(lastML, document.getElementById('nomeProjeto').value, lastLang); });

    frm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      try{
        statusEl.textContent="Processando…";
        statusEl.classList.remove('error','success');
        diagBox.style.display='none'; diagBox.textContent='';

        const lang=document.getElementById('lang').value||"pt"; lastLang=lang;
        const nomeProjeto=clean(document.getElementById('nomeProjeto').value||"");
        const desc=clean(document.getElementById('desc').value||"");
        const n=parseInt(nOE.value||0);
        const durationMonths=parseInt(document.getElementById('durMonths').value||0);

        if(!nomeProjeto||!desc||!n) throw new Error("Preencha nome, descrição e qtd. de objetivos.");
        if(!durationMonths || durationMonths<1 || durationMonths>60) throw new Error("Informe a duração do projeto, entre 1 e 60 meses.");

        const objetivosEspecificos=[];
        for(let i=1;i<=n;i++){
          const t=clean(document.getElementById(`oe_t_${i}`).value||"");
          const f=clean(document.getElementById(`oe_f_${i}`).value||"");
          if(!t) throw new Error(`Preencha o título do OE ${i}.`);
          objetivosEspecificos.push({numero:i,titulo:t,foco:f});
        }

        const file=document.getElementById('edital').files?.[0];
        const editalText=clean(await readFileText(file));

        // webhook, unchanged, now includes durationMonths
        try{
          await fetch(WEBHOOK_URL,{
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=UTF-8'},
            body: JSON.stringify({
              nomeProjeto,
              duracaoMeses: durationMonths,
              descricaoProposta: desc,
              objetivosEspecificos,
              objetivosEspecificosTexto: objetivosEspecificos.map(o=>`${o.numero}. ${o.titulo}`).join(' || '),
              edital: ""
            })
          });
        }catch(_){}

        const ml = generateML(nomeProjeto, desc, objetivosEspecificos, editalText, lang, durationMonths);

        lastML=ml;
        renderPreview(ml, lang);
        statusEl.textContent="✓ OK";
        statusEl.classList.add('success');

        diagBox.style.display='block';
        diagBox.textContent=[
          "Diagnóstico:",
          "1) Resultados e atividades são gerados a partir de temas extraídos da descrição e do edital, e não repetem o texto dos OEs.",
          "2) Indicadores usam metas arredondadas, por exemplo 70%, 85%, 120 participantes.",
          "3) Prazos são coerentes com a duração, distribuídos em três fases.",
          "4) A saída mantém estrutura de marco lógico, sem padrões repetitivos do tipo Plan, Improve, Consolidate."
        ].join("\n");
      }catch(err){
        statusEl.textContent="Erro: "+err.message;
        statusEl.classList.add('error');
        diagBox.style.display='block';
        diagBox.textContent=(err.stack||String(err));
      }
    });
  </script>
