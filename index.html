<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Gerador de Marco Lógico — Tabela</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    body{
      margin:0;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background:#fafafa;
      color:#1b1b1b;
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
    }
    h1{
      font-size:24px;
      margin-bottom:16px;
    }
    form{
      background:#fff;
      border:1px solid #ddd;
      border-radius:8px;
      padding:16px;
      margin-bottom:24px;
    }
    label{
      font-weight:600;
      display:block;
      margin-top:12px;
      margin-bottom:6px;
    }
    input, textarea, select{
      width:100%;
      padding:8px;
      border:1px solid #ccc;
      border-radius:6px;
      font:inherit;
    }
    textarea{min-height:90px}
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    button{
      margin-top:16px;
      background:#1E7E34;
      color:#fff;
      border:0;
      padding:10px 16px;
      border-radius:6px;
      font-weight:600;
      cursor:pointer;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#e6e6e6;
      font-size:14px;
    }
    th, td{
      border:1px solid #bfbfbf;
      padding:8px 10px;
      vertical-align:top;
    }
    th{
      background:#d9d9d9;
      font-weight:600;
      text-align:left;
    }
    .col-obj{
      width:220px;
      font-weight:600;
      background:#d9d9d9;
    }
    .preview{
      background:#fff;
      border:1px solid #ccc;
      padding:12px;
      overflow:auto;
    }
  </style>
</head>
<body>

<div class="wrap">
  <h1>Gerador de Marco Lógico</h1>

  <form id="frm">
    <label>Título do Projeto</label>
    <input id="titulo" required>

    <label>Descrição da Proposta</label>
    <textarea id="descricao" required></textarea>

    <div class="row">
      <div>
        <label>Idioma de saída</label>
        <select id="lang">
          <option value="pt" selected>Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>
      <div>
        <label>Duração do projeto, em meses</label>
        <input type="number" id="meses" value="12" min="1" max="60" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Número de Objetivos Específicos</label>
        <select id="nOE">
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      </div>
      <div>
        <label>Arquivo do Edital, opcional</label>
        <input type="file" id="edital" accept=".pdf,.docx,.txt">
      </div>
    </div>

    <button type="submit">Gerar Marco Lógico</button>
  </form>

  <div id="previewBox" class="preview" style="display:none">
    <table id="tbl"></table>
    <button id="baixarXlsx">Baixar XLSX</button>
  </div>
</div>

<script>
function gerarTextoBase(desc){
  return desc.split(".")[0] || desc;
}

function gerarMarcoLogico({titulo, descricao, nOE, meses}){
  const og = `Fortalecer ${titulo.toLowerCase()}, ampliando capacidades locais e promovendo impactos socioambientais sustentáveis ao longo de ${meses} meses.`;

  const oes = [];
  for(let i=1;i<=nOE;i++){
    oes.push({
      titulo:`Aprimorar capacidades institucionais e comunitárias relacionadas ao eixo ${i}.`,
      resultados:[
        {
          r:"Capacidades técnicas e organizacionais fortalecidas.",
          ind:"Número de participantes envolvidos; nível de satisfação.",
          meta:`≥ ${Math.round(1000/nOE)} pessoas capacitadas em ${meses} meses.`,
          mv:"Listas de presença; relatórios técnicos."
        },
        {
          r:"Iniciativas locais estruturadas e em funcionamento.",
          ind:"Número de iniciativas apoiadas.",
          meta:`≥ ${Math.round(10/nOE)} iniciativas estruturadas.`,
          mv:"Planos de ação; registros fotográficos."
        }
      ]
    });
  }
  return {og, oes};
}

function renderTabela(ml){
  const tbl=document.getElementById("tbl");
  tbl.innerHTML="";

  tbl.innerHTML+=`
    <tr>
      <td class="col-obj">Objetivo Geral</td>
      <td colspan="4">${ml.og}</td>
    </tr>
  `;

  ml.oes.forEach((oe,idx)=>{
    tbl.innerHTML+=`
      <tr>
        <td class="col-obj">Objetivo Específico ${idx+1}</td>
        <td colspan="4"><em>${oe.titulo}</em></td>
      </tr>
      <tr>
        <th></th>
        <th>Resultados</th>
        <th>Indicadores</th>
        <th>Meta</th>
        <th>Meios de Verificação</th>
      </tr>
    `;
    oe.resultados.forEach(r=>{
      tbl.innerHTML+=`
        <tr>
          <td></td>
          <td>${r.r}</td>
          <td>${r.ind}</td>
          <td>${r.meta}</td>
          <td>${r.mv}</td>
        </tr>
      `;
    });
  });
}

document.getElementById("frm").addEventListener("submit",e=>{
  e.preventDefault();

  const data={
    titulo:document.getElementById("titulo").value,
    descricao:document.getElementById("descricao").value,
    nOE:parseInt(document.getElementById("nOE").value),
    meses:parseInt(document.getElementById("meses").value)
  };

  const ml=gerarMarcoLogico(data);
  renderTabela(ml);

  document.getElementById("previewBox").style.display="block";

  document.getElementById("baixarXlsx").onclick=()=>{
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.table_to_sheet(document.getElementById("tbl"));
    XLSX.utils.book_append_sheet(wb,ws,"Marco Lógico");
    XLSX.writeFile(wb,"marco_logico.xlsx");
  };
});
</script>

</body>
</html>
