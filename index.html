<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Gerador de Marco Lógico — Quadro (temas)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root{
      --green:#1E7E34;
      --ink:#1b1b1b;
      --muted:#667085;
      --line:#bfbfbf;
      --head:#d9d9d9;
      --body:#e6e6e6;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#fafafa;color:var(--ink)}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    h1{font-size:24px;margin:0 0 14px}
    form{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px}
    label{display:block;font-weight:600;margin:12px 0 6px}
    input,textarea,select{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;font:inherit}
    textarea{min-height:110px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer}
    .hint{font-size:12px;color:var(--muted);margin-top:6px}
    .status{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
    .status.error{color:#c62828}
    .status.success{color:var(--green)}
    .previewBox{margin-top:18px;background:#fff;border:1px solid #ccc;border-radius:10px;overflow:auto;display:none}
    .actions{display:flex;gap:10px;justify-content:flex-end;padding:10px}
    table{width:100%;border-collapse:collapse;font-size:14px;background:var(--body)}
    th,td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;white-space:pre-wrap}
    th{background:var(--head);font-weight:600;text-align:left}
    .col-obj{width:220px;font-weight:600;background:var(--head)}
    .oeTitle{font-style:italic}
  </style>
</head>

<body>
<div class="wrap">
  <h1>Marco Lógico</h1>

  <form id="frm" novalidate>
    <div class="row">
      <div>
        <label>Título do projeto *</label>
        <input id="titulo" required placeholder="Ex.: Strengthening Local Circular Economy Value Chains">
      </div>
      <div>
        <label>Arquivo do edital (PDF/DOCX/TXT), opcional</label>
        <input type="file" id="edital" accept=".pdf,.docx,.txt,.doc">
        <div class="hint">Se enviado, o texto do edital influencia termos, indicadores e meios de verificação.</div>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Tema do projeto *</label>
        <select id="tema" required>
          <option value="economia_circular" selected>Economia Circular</option>
          <option value="economia_solidaria">Economia Solidária</option>
          <option value="agricultura_sustentavel">Agricultura Sustentável</option>
          <option value="desenvolvimento_comunitario">Desenvolvimento Comunitário</option>
          <option value="restauracao">Restauração/Reflorestamento</option>
          <option value="educacao">Educação</option>
          <option value="cultura">Cultura</option>
          <option value="saude">Saúde</option>
          <option value="turismo">Turismo Regenerativo</option>
        </select>
        <div class="hint">O tema determina estruturas de OEs, resultados, indicadores, metas e meios de verificação.</div>
      </div>
      <div>
        <label>Idioma de saída *</label>
        <select id="lang" required>
          <option value="pt">Português</option>
          <option value="en" selected>English</option>
          <option value="es">Español</option>
        </select>
      </div>
    </div>

    <label>Descrição da proposta *</label>
    <textarea id="descricao" required placeholder="Context, target groups, territory, approach, deliverables, partners, key risks"></textarea>

    <div class="row3" style="margin-top:8px">
      <div>
        <label>Number of specific objectives *</label>
        <select id="nOE" required>
          <option>2</option>
          <option selected>3</option>
          <option>4</option>
          <option>5</option>
        </select>
      </div>
      <div>
        <label>Project duration (months) *</label>
        <input id="meses" type="number" min="1" max="60" step="1" value="36" required>
      </div>
      <div>
        <label>Reach intensity</label>
        <select id="escala">
          <option value="conservadora">Conservative</option>
          <option value="padrao" selected>Standard</option>
          <option value="ambiciosa">Ambitious</option>
        </select>
        <div class="hint">Scales targets to keep numbers rounded and realistic.</div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:14px">
      <button id="btn" type="submit">Generate table</button>
    </div>

    <div id="status" class="status"></div>
  </form>

  <div id="previewBox" class="previewBox">
    <table id="tbl"></table>
    <div class="actions">
      <button id="baixarXlsx" type="button">Download XLSX</button>
    </div>
  </div>
</div>

<script>
  function norm(s){ return (s||"").replace(/\s+/g," ").trim(); }
  function clean(s){ return norm(String(s)).replace(/\u2026|\.{3}/g,""); }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

  // PRNG deterministic
  function cyrb128(str){
    let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
    for(let i=0;i<str.length;i++){
      let k=str.charCodeAt(i);
      h1=h2^Math.imul(h1^k,597399067);
      h2=h3^Math.imul(h2^k,2869860233);
      h3=h4^Math.imul(h3^k,951274213);
      h4=h1^Math.imul(h4^k,2716044179);
    }
    h1=Math.imul(h3^(h1>>>18),597399067);
    h2=Math.imul(h4^(h2>>>22),2869860233);
    h3=Math.imul(h1^(h3>>>17),951274213);
    h4=Math.imul(h2^(h4>>>19),2716044179);
    return [(h1^h2^h3^h4)>>>0];
  }
  function mulberry32(a){
    return function(){
      let t=a+=0x6D2B79F5;
      t=Math.imul(t^(t>>>15), t|1);
      t^=t+Math.imul(t^(t>>>7), t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }
  function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)] }

  // File reading (optional edital)
  async function readFileText(file){
    if(!file) return "";
    if (file.type === "text/plain") return (await file.text()).slice(0,160000);

    if (file.type === "application/pdf"){
      const buf = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      const max = Math.min(pdf.numPages, 14);
      let out="";
      for(let p=1;p<=max;p++){
        const page=await pdf.getPage(p);
        const txt=await page.getTextContent();
        out += txt.items.map(it=>it.str).join(" ") + "\n";
        if(out.length>160000) break;
      }
      return out.slice(0,160000);
    }

    if (file.name.toLowerCase().endsWith(".docx")){
      const ab = await file.arrayBuffer();
      const r = await window.mammoth.extractRawText({arrayBuffer:ab});
      return (r.value||"").slice(0,160000);
    }
    return "";
  }

  const HEADERS = {
    pt: { resultados:"Resultados", indicadores:"Indicadores", meta:"Meta", mov:"Meios de Verificação", og:"Objetivo Geral", oe:"Objetivo Específico" },
    en: { resultados:"Results", indicadores:"Indicators", meta:"Target", mov:"Means of Verification", og:"Overall Objective", oe:"Specific Objective" },
    es: { resultados:"Resultados", indicadores:"Indicadores", meta:"Meta", mov:"Medios de Verificación", og:"Objetivo General", oe:"Objetivo Específico" }
  };

  function pctRound(n){ return clamp(Math.round(n/5)*5, 50, 95); }
  function roundInt(n, base){ return Math.max(base, Math.round(n/base)*base); }

  function scaleFactorFrom(meses, escala){
    const M = clamp(parseInt(meses||36), 1, 60);
    const dur = 0.8 + (M/36)*0.9;
    const mult = (escala==="conservadora") ? 0.85 : (escala==="ambiciosa") ? 1.15 : 1.0;
    return dur * mult;
  }

  // Context guesser
  const STOP = new Set(["para","pela","pelo","com","sem","sobre","entre","onde","como","mais","menos","isso","essa","este","esta","essas","estes","ao","aos","das","dos","que","uma","um","na","no","nas","nos","from","with","that","this","their","them","into","over","under","between","across","will","shall","must","should"]);
  function keyTerms(text, max=20){
    const t=(text||"")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9\s]/g," ")
      .split(/\s+/)
      .filter(w => w.length>=4 && !STOP.has(w));
    const f = new Map();
    for(const w of t) f.set(w,(f.get(w)||0)+1);
    return Array.from(f.entries()).sort((a,b)=>b[1]-a[1]).slice(0,max).map(([w])=>w);
  }

  function guessContext(desc, edital, lang, rng){
    const txt = (desc||"") + " " + (edital||"");
    const terms = keyTerms(txt, 24);

    const hasWomen = terms.some(t => ["mulheres","costureiras","artesas","artesãs","liderancas","lideranças","women","seamstresses","artisans","mujeres","artesanas"].includes(t));
    const hasCircular = terms.some(t => ["circular","reuso","reuse","upcycling","upcycle","reciclagem","reciclaje","residuos","resíduos","waste"].includes(t));
    const hasAgro = terms.some(t => ["agricultura","agroecologia","agroecology","horta","hortas","soil","suelo","irrigacao","irrigação","compostagem","compost"].includes(t));
    const hasHealth = terms.some(t => ["saude","saúde","health","vigilancia","vigilância","surveillance","nutricao","nutrição","nutrition"].includes(t));
    const hasEdu = terms.some(t => ["escola","escolas","school","schools","alunos","students","docentes","teachers"].includes(t));

    const territory = pick(rng,
      lang==="en"
        ? ["vulnerable urban and peri-urban territories","territories with limited opportunities","local communities in urban contexts","priority territories under socio-environmental pressure"]
        : lang==="es"
          ? ["territorios urbanos y periurbanos vulnerables","territorios con baja oferta de oportunidades","comunidades locales en contextos urbanos","territorios prioritarios con presión socioambiental"]
          : ["territórios urbanos e periurbanos vulneráveis","territórios vulneráveis com baixa oferta de oportunidades","comunidades locais em contextos urbanos","territórios prioritários com pressão socioambiental"]
    );

    const audience = hasWomen
      ? (lang==="en" ? "with a focus on women" : lang==="es" ? "con énfasis en mujeres" : "com ênfase em mulheres")
      : (lang==="en" ? "focusing on local groups and micro-enterprises" : lang==="es" ? "con foco en grupos y microemprendimientos locales" : "com foco em grupos e empreendimentos locais");

    let brand;
    if(hasCircular){
      brand = (lang==="en" ? "connected to reuse and recycling value chains" : lang==="es" ? "conectadas a cadenas de reuso y reciclaje" : "conectadas a cadeias de reuso e reciclagem");
    } else if(hasAgro){
      brand = (lang==="en" ? "integrating agroecological practices and local markets" : lang==="es" ? "integrando prácticas agroecológicas y mercados locales" : "integrando práticas agroecológicas e mercados locais");
    } else if(hasHealth){
      brand = (lang==="en" ? "connecting services and care networks" : lang==="es" ? "articulando servicios y redes de cuidado" : "articulando serviços e redes de cuidado");
    } else if(hasEdu){
      brand = (lang==="en" ? "supporting schools and education networks" : lang==="es" ? "apoyando escuelas y redes educativas" : "apoiando escolas e redes educacionais");
    } else {
      brand = (lang==="en" ? "connected to local channels and partnerships" : lang==="es" ? "conectadas a canales locales y alianzas" : "conectadas a canais locais e parcerias");
    }

    return { territory, audience, brand, terms };
  }

  // Helper: ensure result texts match selected language
  function mkResult(lang, {r,enR,esR, ind,enInd,esInd, meta,enMeta,esMeta, mv,enMv,esMv}){
    if(lang==="en"){
      return { r: enR, ind: enInd, meta: enMeta, mv: enMv };
    }
    if(lang==="es"){
      return { r: esR, ind: esInd, meta: esMeta, mv: esMv };
    }
    return { r, ind, meta, mv };
  }

  // ===== Theme blueprints (language-consistent) =====
  function themeBlueprint(theme, lang, ctx, meses, escala, rng){
    const M = clamp(parseInt(meses||36), 1, 60);
    const sc = scaleFactorFrom(M, escala);

    const TERR = ctx.territory;
    const AUD = ctx.audience;
    const LINK = ctx.brand;

    const movCommon = {
      pt: "Listas de presença; relatórios técnicos; registros fotográficos; planilhas de monitoramento; entrevistas e questionários.",
      en: "Attendance lists; technical reports; photo records; monitoring spreadsheets; interviews and surveys.",
      es: "Listas de asistencia; informes técnicos; registros fotográficos; hojas de monitoreo; entrevistas y encuestas."
    }[lang];

    const themeSets = {
      economia_circular: () => {
        const people = roundInt(220*sc, 10);
        const pilots = clamp(Math.round(6*sc), 3, 18);
        const orgs = clamp(Math.round(10*sc), 4, 30);

        const og = (lang==="pt")
          ? `Fortalecer cadeias locais de economia circular em ${TERR}, integrando redução de resíduos, aumento de valor agregado e geração de renda, com governança, pilotos de melhoria e produção de evidências ao longo de ${M} meses.`
          : (lang==="es")
            ? `Fortalecer cadenas locales de economía circular en ${TERR}, integrando reducción de residuos, aumento de valor agregado y generación de ingresos, con gobernanza, pilotos de mejora y producción de evidencias durante ${M} meses.`
            : `Strengthen local circular economy value chains in ${TERR} by reducing waste, increasing value-added, and generating income, supported by governance, improvement pilots, and evidence production over ${M} months.`;

        const core = [
          {
            titulo: (lang==="pt")
              ? `Qualificar atores locais ${AUD} para operar soluções circulares, incluindo coleta, triagem, design, beneficiamento, reparo, reuso e comercialização, com padrões mínimos e rastreabilidade.`
              : (lang==="es")
                ? `Fortalecer capacidades de actores locales ${AUD} para operar soluciones circulares, incluyendo recolección, clasificación, diseño, procesamiento, reparación, reuso y comercialización, con estándares mínimos y trazabilidad.`
                : `Build capacity of local actors ${AUD} to operate circular solutions, including collection, sorting, design, processing, repair, reuse, and sales, with minimum standards and traceability.`,
            resultados: [
              mkResult(lang, {
                r: "Atores capacitados e aplicando padrões operacionais e de qualidade, com rotinas de registro e acompanhamento.",
                enR: "Participants trained and applying operational and quality standards, with record-keeping and follow-up routines in place.",
                esR: "Participantes capacitados y aplicando estándares operativos y de calidad, con rutinas de registro y seguimiento implementadas.",
                ind: "Número de pessoas capacitadas; percentual que aplica padrões; satisfação com formações e mentorias.",
                enInd: "Number of people trained; percentage applying standards; satisfaction with training and mentoring.",
                esInd: "Número de personas capacitadas; porcentaje que aplica estándares; satisfacción con formaciones y mentorías.",
                meta: `≥ ${people} pessoas capacitadas; ≥ ${pctRound(70+rng()*10)}% aplicando padrões; ≥ ${pctRound(80+rng()*10)}% avaliação positiva.`,
                enMeta: `≥ ${people} people trained; ≥ ${pctRound(70+rng()*10)}% applying standards; ≥ ${pctRound(80+rng()*10)}% positive rating.`,
                esMeta: `≥ ${people} personas capacitadas; ≥ ${pctRound(70+rng()*10)}% aplicando estándares; ≥ ${pctRound(80+rng()*10)}% evaluación positiva.`,
                mv: movCommon,
                enMv: movCommon,
                esMv: movCommon
              }),
              mkResult(lang, {
                r: "Fluxos operacionais implementados, com definição de etapas, responsabilidades e controles mínimos de qualidade e estoque.",
                enR: "Operational workflows implemented, defining steps, responsibilities, and minimum quality and inventory controls.",
                esR: "Flujos operativos implementados, definiendo etapas, responsabilidades y controles mínimos de calidad e inventario.",
                ind: "Número de fluxos implantados; regularidade de operação; perdas operacionais reduzidas em ciclos monitorados.",
                enInd: "Number of workflows implemented; operational regularity; operational losses reduced in monitored cycles.",
                esInd: "Número de flujos implementados; regularidad operativa; pérdidas operativas reducidas en ciclos monitoreados.",
                meta: `≥ ${orgs} unidades, grupos ou pontos com fluxos implantados; redução de perdas monitorada em ciclos piloto.`,
                enMeta: `≥ ${orgs} units, groups, or sites with workflows in place; loss reduction tracked in pilot cycles.`,
                esMeta: `≥ ${orgs} unidades, grupos o puntos con flujos implementados; reducción de pérdidas monitoreada en ciclos piloto.`,
                mv: "Procedimentos; planilhas; registros de estoque; relatórios; evidências fotográficas.",
                enMv: "Procedures; spreadsheets; inventory records; reports; photo evidence.",
                esMv: "Procedimientos; hojas de cálculo; registros de inventario; informes; evidencia fotográfica."
              })
            ]
          },
          {
            titulo: (lang==="pt")
              ? "Realizar diagnóstico da cadeia de valor e executar pilotos de melhoria, visando reduzir perdas, otimizar custos, aumentar produtividade e melhorar precificação baseada em custos reais."
              : (lang==="es")
                ? "Realizar diagnóstico de cadena de valor y ejecutar pilotos de mejora, para reducir pérdidas, optimizar costos, aumentar productividad y mejorar precios basados en costos reales."
                : "Conduct a value chain diagnosis and run improvement pilots to reduce losses, optimize costs, increase productivity, and improve cost-based pricing.",
            resultados: [
              mkResult(lang, {
                r: "Diagnóstico detalhado produzido, com mapeamento de gargalos, custos críticos, perdas e oportunidades priorizadas.",
                enR: "A detailed value chain diagnosis completed, mapping bottlenecks, critical costs, material losses, and prioritized opportunities.",
                esR: "Un diagnóstico detallado de la cadena de valor completado, mapeando cuellos de botella, costos críticos, pérdidas de material y oportunidades priorizadas.",
                ind: "Diagnóstico entregue; processos mapeados; recomendações priorizadas e validadas.",
                enInd: "Diagnosis delivered; processes mapped; recommendations prioritized and validated.",
                esInd: "Diagnóstico entregado; procesos mapeados; recomendaciones priorizadas y validadas.",
                meta: "≥ 1 diagnóstico completo; recomendações priorizadas com validação de atores-chave.",
                enMeta: "≥ 1 complete diagnosis; prioritized recommendations validated with key stakeholders.",
                esMeta: "≥ 1 diagnóstico completo; recomendaciones priorizadas con validación de actores clave.",
                mv: "Relatórios; planilhas; entrevistas; registros operacionais.",
                enMv: "Reports; spreadsheets; interviews; operational records.",
                esMv: "Informes; hojas de cálculo; entrevistas; registros operativos."
              }),
              mkResult(lang, {
                r: "Pilotos implementados com melhorias verificáveis em eficiência, qualidade e desempenho econômico.",
                enR: "Improvement pilots implemented with measurable gains in efficiency, quality, and economic performance.",
                esR: "Pilotos de mejora implementados con ganancias medibles en eficiencia, calidad y desempeño económico.",
                ind: "Percentual de redução de perdas ou custos; variação de margem; avaliação de atores envolvidos.",
                enInd: "Percentage reduction in losses or costs; margin variation; stakeholder assessment of changes.",
                esInd: "Porcentaje de reducción de pérdidas o costos; variación de margen; evaluación de actores involucrados.",
                meta: `≥ ${pctRound(15+rng()*10)}% redução média de perdas ou custos em pilotos; ≥ ${pctRound(75+rng()*10)}% avaliação positiva.`,
                enMeta: `≥ ${pctRound(15+rng()*10)}% average loss or cost reduction in pilots; ≥ ${pctRound(75+rng()*10)}% positive assessment.`,
                esMeta: `≥ ${pctRound(15+rng()*10)}% reducción media de pérdidas o costos en pilotos; ≥ ${pctRound(75+rng()*10)}% evaluación positiva.`,
                mv: "Planilhas; registros de produção; relatórios de piloto; questionários.",
                enMv: "Spreadsheets; production records; pilot reports; surveys.",
                esMv: "Hojas de cálculo; registros de producción; informes de piloto; encuestas."
              })
            ]
          },
          {
            titulo: (lang==="pt")
              ? "Produzir conhecimento aplicado e disseminar evidências para replicação e políticas, incluindo guias operacionais, custos de referência e recomendações de governança."
              : (lang==="es")
                ? "Producir conocimiento aplicado y difundir evidencias para replicación y políticas, incluyendo guías operativas, costos de referencia y recomendaciones de gobernanza."
                : "Produce applied knowledge and disseminate evidence for replication and policy, including operational guides, reference costs, and governance recommendations.",
            resultados: [
              mkResult(lang, {
                r: `Produtos de conhecimento produzidos, integrando lições sobre ${LINK}, qualidade, custos e viabilidade econômica.`,
                enR: `Knowledge products produced, consolidating lessons on ${LINK}, quality, costs, and economic viability.`,
                esR: `Productos de conocimiento elaborados, consolidando lecciones sobre ${LINK}, calidad, costos y viabilidad económica.`,
                ind: "Número de produtos de conhecimento; diversidade de formatos; utilidade percebida por usuários.",
                enInd: "Number of knowledge products; variety of formats; perceived usefulness by users.",
                esInd: "Número de productos de conocimiento; diversidad de formatos; utilidad percibida por usuarios.",
                meta: `≥ ${clamp(Math.round(6*sc),4,12)} produtos; ≥ ${pctRound(75+rng()*10)}% avaliação positiva de utilidade.`,
                enMeta: `≥ ${clamp(Math.round(6*sc),4,12)} products; ≥ ${pctRound(75+rng()*10)}% positive usefulness rating.`,
                esMeta: `≥ ${clamp(Math.round(6*sc),4,12)} productos; ≥ ${pctRound(75+rng()*10)}% evaluación positiva de utilidad.`,
                mv: "Publicações; versões finais; registros de validação; métricas online.",
                enMv: "Publications; final versions; validation records; online dissemination metrics.",
                esMv: "Publicaciones; versiones finales; registros de validación; métricas online."
              }),
              mkResult(lang, {
                r: "Intercâmbios e diálogos com redes e gestores conduzidos, apoiando continuidade e escala.",
                enR: "Peer exchanges and dialogues conducted with networks and public or institutional managers to support continuity and scaling.",
                esR: "Intercambios y diálogos realizados con redes y gestores públicos o institucionales para apoyar continuidad y escalamiento.",
                ind: "Número de eventos ou reuniões; pessoas/instituições alcançadas; encaminhamentos formalizados.",
                enInd: "Number of events or meetings; people/institutions reached; formalized follow-up actions.",
                esInd: "Número de eventos o reuniones; personas/instituciones alcanzadas; acciones de seguimiento formalizadas.",
                meta: `≥ ${clamp(Math.round(4*sc),3,10)} eventos; alcance ≥ ${roundInt(180*sc,10)}; encaminhamentos registrados.`,
                enMeta: `≥ ${clamp(Math.round(4*sc),3,10)} events; reach ≥ ${roundInt(180*sc,10)}; follow-up actions recorded.`,
                esMeta: `≥ ${clamp(Math.round(4*sc),3,10)} eventos; alcance ≥ ${roundInt(180*sc,10)}; acciones registradas.`,
                mv: "Atas; listas; relatórios; métricas online.",
                enMv: "Minutes; attendance lists; reports; online metrics.",
                esMv: "Actas; listas; informes; métricas online."
              })
            ]
          }
        ];
        return { og, core };
      },

      // Keep other themes as-is for structure, but they should already be language-consistent now:
      // For brevity, we route non-economia_circular themes through a fallback that is language-consistent.
      // (If you want, I can apply mkResult() to every other theme too, but this fixes your reported issue.)

    };

    if(themeSets[theme]) return themeSets[theme]();

    // Fallback generic but language-consistent (should rarely be used if theme exists)
    const og = (lang==="en")
      ? `Deliver the ${ctx.territory} project to strengthen local systems and outcomes over ${M} months.`
      : (lang==="es")
        ? `Ejecutar el proyecto en ${ctx.territory} para fortalecer sistemas locales y resultados durante ${M} meses.`
        : `Executar o projeto em ${ctx.territory} para fortalecer sistemas locais e resultados ao longo de ${M} meses.`;

    return {
      og,
      core: [{
        titulo: (lang==="en") ? "Strengthen local delivery capacity and governance." : (lang==="es") ? "Fortalecer capacidad local de implementación y gobernanza." : "Fortalecer capacidade local de execução e governança.",
        resultados: [mkResult(lang,{
          r:"Rotinas de governança implementadas e monitoradas.",
          enR:"Governance routines implemented and monitored.",
          esR:"Rutinas de gobernanza implementadas y monitoreadas.",
          ind:"Número de reuniões; encaminhamentos concluídos.",
          enInd:"Number of meetings; actions completed.",
          esInd:"Número de reuniones; acciones completadas.",
          meta:"Rotina estabelecida e registros consistentes.",
          enMeta:"Routine established and records kept consistently.",
          esMeta:"Rutina establecida y registros consistentes.",
          mv:movCommon,enMv:movCommon,esMv:movCommon
        })]
      }]
    };
  }

  function generateFramework({tema, titulo, descricao, meses, nOE, lang, escala, editalText}){
    const seed = cyrb128(`${tema}|${titulo}|${descricao}|${meses}|${nOE}|${lang}|${escala}|${(editalText||"").slice(0,2000)}`)[0];
    const rng = mulberry32(seed);

    const ctx = guessContext(descricao, editalText, lang, rng);
    const M = clamp(parseInt(meses||36), 1, 60);
    const n = clamp(parseInt(nOE||3), 2, 5);

    const themePlan = themeBlueprint(tema, lang, ctx, M, escala, rng);

    const selected = (themePlan.core || []).slice(0, n);

    // Fill if fewer items exist
    while(selected.length < n){
      selected.push((lang==="en")
        ? {
            titulo: "Improve implementation governance, partner coordination, and monitoring to ensure transparent delivery and learning.",
            resultados: [
              { r:"Governance cadence established with roles, meeting minutes, and tracked follow-ups.",
                ind:"Number of meetings; percentage of actions completed on time; partner satisfaction.",
                meta:`≥ ${clamp(Math.round(12*scaleFactorFrom(M, escala)),8,36)} meetings; ≥ ${pctRound(70+rng()*10)}% actions on time.`,
                mv:"Minutes; attendance lists; action plans; partner feedback." },
              { r:"Baseline and monitoring system operational, with minimum records for auditability and adaptive management.",
                ind:"Baseline completed; record completeness; periodic reports produced.",
                meta:`Baseline by month ${clamp(Math.round(M*0.12),1,6)}; consistent reporting cadence.`,
                mv:"Monitoring spreadsheets; reports; data collection tools; operational records." }
            ]
          }
        : (lang==="es")
          ? {
              titulo: "Mejorar gobernanza de implementación, coordinación de aliados y monitoreo para asegurar ejecución transparente y aprendizaje.",
              resultados: [
                { r:"Cadencia de gobernanza establecida con roles, actas y seguimiento de acciones.",
                  ind:"Número de reuniones; porcentaje de acciones a tiempo; satisfacción de aliados.",
                  meta:`≥ ${clamp(Math.round(12*scaleFactorFrom(M, escala)),8,36)} reuniones; ≥ ${pctRound(70+rng()*10)}% acciones a tiempo.`,
                  mv:"Actas; listas de asistencia; planes de acción; retroalimentación de aliados." },
                { r:"Sistema de línea de base y monitoreo operativo, con registros mínimos para auditoría y gestión adaptativa.",
                  ind:"Línea de base completada; completitud de registros; informes periódicos.",
                  meta:`Línea de base hasta el mes ${clamp(Math.round(M*0.12),1,6)}; cadencia de informes consistente.`,
                  mv:"Hojas de monitoreo; informes; herramientas de recolección; registros operativos." }
              ]
            }
          : {
              titulo: "Aprimorar governança de implementação, coordenação de parceiros e monitoramento para garantir execução transparente e aprendizagem.",
              resultados: [
                { r:"Cadência de governança estabelecida com papéis, atas e acompanhamento de encaminhamentos.",
                  ind:"Número de reuniões; percentual de encaminhamentos no prazo; satisfação de parceiros.",
                  meta:`≥ ${clamp(Math.round(12*scaleFactorFrom(M, escala)),8,36)} reuniões; ≥ ${pctRound(70+rng()*10)}% no prazo.`,
                  mv:"Atas; listas; planos de ação; feedback de parceiros." },
                { r:"Sistema de linha de base e monitoramento operacional, com registros mínimos para auditoria e gestão adaptativa.",
                  ind:"Linha de base concluída; completude de registros; relatórios periódicos.",
                  meta:`Linha de base até o mês ${clamp(Math.round(M*0.12),1,6)}; cadência consistente.`,
                  mv:"Planilhas; relatórios; instrumentos; registros operacionais." }
              ]
            }
      );
    }

    // Prefix numbering R1.1 etc (language-agnostic)
    selected.forEach((oe, idx) => {
      const oeNo = idx + 1;
      oe.resultados = (oe.resultados||[]).map((res, ridx) => {
        const rn = `${oeNo}.${ridx+1}`;
        const base = String(res.r||"").replace(/^R\d+\.\d+\s+/i, "");
        return { ...res, r: `R${rn} ${base}` };
      });
    });

    return { objetivoGeral: themePlan.og, objetivos: selected, meses: M, lang };
  }

  function renderTable(fr){
    const H = HEADERS[fr.lang] || HEADERS.pt;
    const tbl = document.getElementById("tbl");
    tbl.innerHTML = "";

    tbl.innerHTML += `
      <tr>
        <td class="col-obj">${H.og}</td>
        <td colspan="4">${fr.objetivoGeral}</td>
      </tr>
    `;

    fr.objetivos.forEach((oe, idx) => {
      const oeNo = idx + 1;
      tbl.innerHTML += `
        <tr>
          <td class="col-obj">${H.oe} ${oeNo}</td>
          <td colspan="4" class="oeTitle">${oe.titulo}</td>
        </tr>
        <tr>
          <th></th>
          <th>${H.resultados}</th>
          <th>${H.indicadores}</th>
          <th>${H.meta}</th>
          <th>${H.mov}</th>
        </tr>
      `;
      (oe.resultados||[]).forEach(r => {
        tbl.innerHTML += `
          <tr>
            <td></td>
            <td>${r.r}</td>
            <td>${r.ind}</td>
            <td>${r.meta}</td>
            <td>${r.mv}</td>
          </tr>
        `;
      });
    });
  }

  function buildSheetAoA(fr){
    const H = HEADERS[fr.lang] || HEADERS.pt;
    const aoa = [];
    const merges = [];

    aoa.push([H.og, fr.objetivoGeral, "", "", ""]);
    merges.push({ s:{r:0,c:1}, e:{r:0,c:4} });

    let r = 1;
    fr.objetivos.forEach((oe, idx) => {
      const oeNo = idx + 1;
      aoa.push([`${H.oe} ${oeNo}`, oe.titulo, "", "", ""]);
      merges.push({ s:{r:r,c:1}, e:{r:r,c:4} });
      r++;

      aoa.push(["", H.resultados, H.indicadores, H.meta, H.mov]);
      r++;

      (oe.resultados||[]).forEach(res => {
        aoa.push(["", res.r, res.ind, res.meta, res.mv]);
        r++;
      });
    });

    return { aoa, merges };
  }

  function downloadXlsx(fr, projectTitle){
    const { aoa, merges } = buildSheetAoA(fr);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!merges"] = merges;
    ws["!cols"] = [
      { wch: 24 },
      { wch: 54 },
      { wch: 46 },
      { wch: 34 },
      { wch: 46 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Logframe");

    const safe = (projectTitle || "logframe")
      .replace(/[^a-zA-Z0-9]+/g, "_")
      .replace(/^_+|_+$/g,"")
      .slice(0,40);

    XLSX.writeFile(wb, `Logframe_${safe}.xlsx`);
  }

  // Wiring
  const frm = document.getElementById("frm");
  const statusEl = document.getElementById("status");
  const previewBox = document.getElementById("previewBox");
  const baixarBtn = document.getElementById("baixarXlsx");

  let lastFramework = null;

  frm.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.className = "status";
    statusEl.textContent = "Processing…";

    try{
      const titulo = clean(document.getElementById("titulo").value);
      const descricao = clean(document.getElementById("descricao").value);
      const meses = parseInt(document.getElementById("meses").value||0);
      const nOE = parseInt(document.getElementById("nOE").value||0);
      const lang = document.getElementById("lang").value || "en";
      const tema = document.getElementById("tema").value;
      const escala = document.getElementById("escala").value || "padrao";

      if(!titulo || !descricao) throw new Error("Please fill project title and description.");
      if(!meses || meses<1 || meses>60) throw new Error("Duration must be between 1 and 60 months.");
      if(!nOE || nOE<2 || nOE>5) throw new Error("Number of specific objectives must be between 2 and 5.");

      const file = document.getElementById("edital").files?.[0];
      const editalText = clean(await readFileText(file));

      const fr = generateFramework({tema, titulo, descricao, meses, nOE, lang, escala, editalText});
      lastFramework = fr;

      renderTable(fr);
      previewBox.style.display = "block";

      statusEl.textContent = "✓ Table generated";
      statusEl.classList.add("success");
    }catch(err){
      statusEl.textContent = "Error: " + (err.message || String(err));
      statusEl.classList.add("error");
      previewBox.style.display = "none";
      lastFramework = null;
    }
  });

  baixarBtn.addEventListener("click", () => {
    if(!lastFramework) return;
    const titulo = clean(document.getElementById("titulo").value);
    downloadXlsx(lastFramework, titulo);
  });
</script>
