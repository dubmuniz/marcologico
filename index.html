<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Gerador de Marco Lógico — Quadro (temas)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root{
      --green:#1E7E34;
      --ink:#1b1b1b;
      --muted:#667085;
      --line:#bfbfbf;
      --head:#d9d9d9;
      --body:#e6e6e6;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#fafafa;color:var(--ink)}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    h1{font-size:24px;margin:0 0 14px}
    form{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px}
    label{display:block;font-weight:600;margin:12px 0 6px}
    input,textarea,select{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;font:inherit}
    textarea{min-height:110px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer}
    .hint{font-size:12px;color:var(--muted);margin-top:6px}
    .status{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
    .status.error{color:#c62828}
    .status.success{color:var(--green)}
    .previewBox{margin-top:18px;background:#fff;border:1px solid #ccc;border-radius:10px;overflow:auto;display:none}
    .actions{display:flex;gap:10px;justify-content:flex-end;padding:10px}
    table{width:100%;border-collapse:collapse;font-size:14px;background:var(--body)}
    th,td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;white-space:pre-wrap}
    th{background:var(--head);font-weight:600;text-align:left}
    .col-obj{width:220px;font-weight:600;background:var(--head)}
    .oeTitle{font-style:italic}
  </style>
</head>

<body>
<div class="wrap">
  <h1>Marco Lógico</h1>

  <form id="frm" novalidate>
    <div class="row">
      <div>
        <label>Título do projeto *</label>
        <input id="titulo" required placeholder="Ex.: Fortalecimento de cadeias locais de economia circular">
      </div>
      <div>
        <label>Arquivo do edital (PDF/DOCX/TXT), opcional</label>
        <input type="file" id="edital" accept=".pdf,.docx,.txt,.doc">
        <div class="hint">Se enviado, o texto do edital influencia termos, indicadores e meios de verificação.</div>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Tema do projeto *</label>
        <select id="tema" required>
          <option value="economia_circular" selected>Economia Circular</option>
          <option value="economia_solidaria">Economia Solidária</option>
          <option value="agricultura_sustentavel">Agricultura Sustentável</option>
          <option value="desenvolvimento_comunitario">Desenvolvimento Comunitário</option>
          <option value="restauracao">Restauração/Reflorestamento</option>
          <option value="educacao">Educação</option>
          <option value="cultura">Cultura</option>
          <option value="saude">Saúde</option>
          <option value="turismo">Turismo Regenerativo</option>
        </select>
        <div class="hint">O tema determina estruturas de OEs, resultados, indicadores, metas e meios de verificação.</div>
      </div>
      <div>
        <label>Idioma de saída *</label>
        <select id="lang" required>
          <option value="pt" selected>Português</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </div>
    </div>

    <label>Descrição da proposta *</label>
    <textarea id="descricao" required placeholder="Contexto, público, território, metodologia, entregas, parceiros, riscos principais"></textarea>

    <div class="row3" style="margin-top:8px">
      <div>
        <label>Número de objetivos específicos *</label>
        <select id="nOE" required>
          <option>2</option>
          <option selected>3</option>
          <option>4</option>
          <option>5</option>
        </select>
      </div>
      <div>
        <label>Duração do projeto, em meses *</label>
        <input id="meses" type="number" min="1" max="60" step="1" value="36" required>
      </div>
      <div>
        <label>Intensidade de alcance</label>
        <select id="escala">
          <option value="conservadora">Conservadora</option>
          <option value="padrao" selected>Padrão</option>
          <option value="ambiciosa">Ambiciosa</option>
        </select>
        <div class="hint">Ajusta metas para evitar números “quebrados”.</div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:14px">
      <button id="btn" type="submit">Gerar quadro</button>
    </div>

    <div id="status" class="status"></div>
  </form>

  <div id="previewBox" class="previewBox">
    <table id="tbl"></table>
    <div class="actions">
      <button id="baixarXlsx" type="button">Baixar XLSX</button>
    </div>
  </div>
</div>

<script>
  function norm(s){ return (s||"").replace(/\s+/g," ").trim(); }
  function clean(s){ return norm(String(s)).replace(/\u2026|\.{3}/g,""); }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

  // PRNG deterministic
  function cyrb128(str){
    let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
    for(let i=0;i<str.length;i++){
      let k=str.charCodeAt(i);
      h1=h2^Math.imul(h1^k,597399067);
      h2=h3^Math.imul(h2^k,2869860233);
      h3=h4^Math.imul(h3^k,951274213);
      h4=h1^Math.imul(h4^k,2716044179);
    }
    h1=Math.imul(h3^(h1>>>18),597399067);
    h2=Math.imul(h4^(h2>>>22),2869860233);
    h3=Math.imul(h1^(h3>>>17),951274213);
    h4=Math.imul(h2^(h4>>>19),2716044179);
    return [(h1^h2^h3^h4)>>>0];
  }
  function mulberry32(a){
    return function(){
      let t=a+=0x6D2B79F5;
      t=Math.imul(t^(t>>>15), t|1);
      t^=t+Math.imul(t^(t>>>7), t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }
  function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)] }

  // File reading (optional edital)
  async function readFileText(file){
    if(!file) return "";
    if (file.type === "text/plain") return (await file.text()).slice(0,160000);

    if (file.type === "application/pdf"){
      const buf = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      const max = Math.min(pdf.numPages, 14);
      let out="";
      for(let p=1;p<=max;p++){
        const page=await pdf.getPage(p);
        const txt=await page.getTextContent();
        out += txt.items.map(it=>it.str).join(" ") + "\n";
        if(out.length>160000) break;
      }
      return out.slice(0,160000);
    }

    if (file.name.toLowerCase().endsWith(".docx")){
      const ab = await file.arrayBuffer();
      const r = await window.mammoth.extractRawText({arrayBuffer:ab});
      return (r.value||"").slice(0,160000);
    }
    return "";
  }

  const HEADERS = {
    pt: { resultados:"Resultados", indicadores:"Indicadores", meta:"Meta", mov:"Meios de Verificação", og:"Objetivo Geral", oe:"Objetivo Específico" },
    en: { resultados:"Results", indicadores:"Indicators", meta:"Target", mov:"Means of Verification", og:"Overall Objective", oe:"Specific Objective" },
    es: { resultados:"Resultados", indicadores:"Indicadores", meta:"Meta", mov:"Medios de Verificación", og:"Objetivo General", oe:"Objetivo Específico" }
  };

  function pctRound(n){ return clamp(Math.round(n/5)*5, 50, 95); }
  function roundInt(n, base){ return Math.max(base, Math.round(n/base)*base); }

  function scaleFactorFrom(meses, escala){
    const M = clamp(parseInt(meses||36), 1, 60);
    const dur = 0.8 + (M/36)*0.9;
    const mult = (escala==="conservadora") ? 0.85 : (escala==="ambiciosa") ? 1.15 : 1.0;
    return dur * mult;
  }

  // Context guesser
  const STOP = new Set(["para","pela","pelo","com","sem","sobre","entre","onde","como","mais","menos","isso","essa","este","esta","essas","estes","ao","aos","das","dos","que","uma","um","na","no","nas","nos","from","with","that","this","their","them","into","over","under","between","across","will","shall","must","should"]);
  function keyTerms(text, max=20){
    const t=(text||"")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9\s]/g," ")
      .split(/\s+/)
      .filter(w => w.length>=4 && !STOP.has(w));
    const f = new Map();
    for(const w of t) f.set(w,(f.get(w)||0)+1);
    return Array.from(f.entries()).sort((a,b)=>b[1]-a[1]).slice(0,max).map(([w])=>w);
  }

  function guessContext(desc, edital, lang, rng){
    const txt = (desc||"") + " " + (edital||"");
    const terms = keyTerms(txt, 24);

    const hasWomen = terms.some(t => ["mulheres","costureiras","artesas","artesãs","liderancas","lideranças"].includes(t));
    const hasCircular = terms.some(t => ["circular","reuso","reuse","upcycling","upcycle","reciclagem","residuos","resíduos"].includes(t));
    const hasAgro = terms.some(t => ["agricultura","agroecologia","agroecologia","horta","hortas","solo","irrigacao","irrigação","compostagem"].includes(t));
    const hasHealth = terms.some(t => ["saude","saúde","vigilancia","vigilância","nutricao","nutrição"].includes(t));
    const hasEdu = terms.some(t => ["escola","escolas","alunos","alunas","docentes","aprendizagem"].includes(t));

    const territory = pick(rng, lang==="pt"
      ? ["territórios urbanos e periurbanos vulneráveis","territórios vulneráveis com baixa oferta de oportunidades","comunidades locais em contextos urbanos","territórios prioritários com pressão socioambiental"]
      : lang==="es"
        ? ["territorios urbanos y periurbanos vulnerables","territorios con baja oferta de oportunidades","comunidades locales en contextos urbanos","territorios prioritarios con presión socioambiental"]
        : ["vulnerable urban and peri-urban territories","territories with limited opportunities","local communities in urban contexts","priority territories under socio-environmental pressure"]
    );

    const audience = hasWomen
      ? (lang==="pt" ? "com ênfase em mulheres" : lang==="es" ? "con énfasis en mujeres" : "with a focus on women")
      : (lang==="pt" ? "com foco em grupos e empreendimentos locais" : lang==="es" ? "con foco en grupos y emprendimientos locales" : "focusing on local groups and micro-enterprises");

    let brand;
    if(hasCircular){
      brand = (lang==="pt" ? "conectadas a cadeias de reuso e reciclagem" : lang==="es" ? "conectadas a cadenas de reuso y reciclaje" : "connected to reuse and recycling value chains");
    } else if(hasAgro){
      brand = (lang==="pt" ? "integrando práticas agroecológicas e mercados locais" : lang==="es" ? "integrando prácticas agroecológicas y mercados locales" : "integrating agroecological practices and local markets");
    } else if(hasHealth){
      brand = (lang==="pt" ? "articulando serviços e redes de cuidado" : lang==="es" ? "articulando servicios y redes de cuidado" : "connecting services and care networks");
    } else if(hasEdu){
      brand = (lang==="pt" ? "apoiando escolas e redes educacionais" : lang==="es" ? "apoyando escuelas y redes educativas" : "supporting schools and education networks");
    } else {
      brand = (lang==="pt" ? "conectadas a canais locais e parcerias" : lang==="es" ? "conectadas a canales locales y alianzas" : "connected to local channels and partnerships");
    }

    return { territory, audience, brand, terms };
  }

  // ===== Theme blueprints =====
  function themeBlueprint(theme, lang, ctx, meses, escala, rng){
    const M = clamp(parseInt(meses||36), 1, 60);
    const sc = scaleFactorFrom(M, escala);

    const TERR = ctx.territory;
    const AUD = ctx.audience;
    const LINK = ctx.brand;

    const movCommon = {
      pt: "Listas de presença; relatórios técnicos; registros fotográficos; planilhas de monitoramento; entrevistas e questionários.",
      en: "Attendance lists; technical reports; photo records; monitoring spreadsheets; interviews and surveys.",
      es: "Listas de asistencia; informes técnicos; registros fotográficos; hojas de monitoreo; entrevistas y encuestas."
    }[lang];

    const themeSets = {
      // =================== NEW: Economia Circular ===================
      economia_circular: () => {
        const people = roundInt(220*sc, 10);
        const pilots = clamp(Math.round(6*sc), 3, 18);
        const orgs = clamp(Math.round(10*sc), 4, 30);

        const og = (lang==="pt")
          ? `Fortalecer cadeias locais de economia circular em ${TERR}, integrando redução de resíduos, aumento de valor agregado e geração de renda, com governança, pilotos de melhoria e produção de evidências ao longo de ${M} meses.`
          : (lang==="es")
            ? `Fortalecer cadenas locales de economía circular en ${TERR}, integrando reducción de residuos, aumento de valor agregado y generación de ingresos, con gobernanza, pilotos de mejora y producción de evidencias durante ${M} meses.`
            : `Strengthen local circular economy value chains in ${TERR} by reducing waste, increasing value-added, and generating income, supported by governance, improvement pilots, and evidence production over ${M} months.`;

        const core = [
          {
            titulo: (lang==="pt")
              ? `Qualificar atores locais ${AUD} para operar soluções circulares, incluindo coleta, triagem, design, beneficiamento, reparo, reuso e comercialização, com padrões mínimos e rastreabilidade.`
              : (lang==="es")
                ? `Fortalecer capacidades de actores locales ${AUD} para operar soluciones circulares, incluyendo recolección, clasificación, diseño, procesamiento, reparación, reuso y comercialización, con estándares mínimos y trazabilidad.`
                : `Build capacity of local actors ${AUD} to operate circular solutions, including collection, sorting, design, processing, repair, reuse, and sales, with minimum standards and traceability.`,
            resultados: [
              {
                r: "Atores capacitados e aplicando padrões operacionais e de qualidade, com rotinas de registro e acompanhamento.",
                ind: "Número de pessoas capacitadas; percentual que aplica padrões; satisfação com formações e mentorias.",
                meta: `≥ ${people} pessoas capacitadas; ≥ ${pctRound(70+rng()*10)}% aplicando padrões; ≥ ${pctRound(80+rng()*10)}% avaliação positiva.`,
                mv: movCommon
              },
              {
                r: "Fluxos operacionais implementados, com definição de etapas, responsabilidades e controles mínimos de qualidade e estoque.",
                ind: "Número de fluxos implantados; regularidade de operação; perdas operacionais reduzidas em ciclos monitorados.",
                meta: `≥ ${orgs} unidades, grupos ou pontos com fluxos implantados; redução de perdas monitorada em ciclos piloto.`,
                mv: "Procedimentos; planilhas; registros de estoque; relatórios; evidências fotográficas."
              }
            ]
          },
          {
            titulo: (lang==="pt")
              ? "Realizar diagnóstico da cadeia de valor e executar pilotos de melhoria, visando reduzir perdas, otimizar custos, aumentar produtividade e melhorar precificação baseada em custos reais."
              : (lang==="es")
                ? "Realizar diagnóstico de cadena de valor y ejecutar pilotos de mejora, para reducir pérdidas, optimizar costos, aumentar productividad y mejorar precios basados en costos reales."
                : "Conduct a value chain diagnosis and run improvement pilots to reduce losses, optimize costs, increase productivity, and improve cost-based pricing.",
            resultados: [
              {
                r: "Diagnóstico detalhado produzido, com mapeamento de gargalos, custos críticos, perdas e oportunidades priorizadas.",
                ind: "Diagnóstico entregue; processos mapeados; recomendações priorizadas e validadas.",
                meta: "≥ 1 diagnóstico completo; recomendações priorizadas com validação de atores-chave.",
                mv: "Relatórios; planilhas; entrevistas; registros operacionais."
              },
              {
                r: "Pilotos implementados com melhorias verificáveis em eficiência, qualidade e desempenho econômico.",
                ind: "Percentual de redução de perdas ou custos; variação de margem; avaliação de atores envolvidos.",
                meta: `≥ ${pctRound(15+rng()*10)}% redução média de perdas ou custos em pilotos; ≥ ${pctRound(75+rng()*10)}% avaliação positiva.`,
                mv: "Planilhas; registros de produção; relatórios de piloto; questionários."
              }
            ]
          },
          {
            titulo: (lang==="pt")
              ? "Produzir conhecimento aplicado e disseminar evidências para replicação e políticas, incluindo guias operacionais, custos de referência e recomendações de governança."
              : (lang==="es")
                ? "Producir conocimiento aplicado y difundir evidencias para replicación y políticas, incluyendo guías operativas, costos de referencia y recomendaciones de gobernanza."
                : "Produce applied knowledge and disseminate evidence for replication and policy, including operational guides, reference costs, and governance recommendations.",
            resultados: [
              {
                r: `Produtos de conhecimento produzidos, integrando lições sobre ${LINK}, qualidade, custos e viabilidade econômica.`,
                ind: "Número de produtos de conhecimento; diversidade de formatos; utilidade percebida por usuários.",
                meta: `≥ ${clamp(Math.round(6*sc),4,12)} produtos; ≥ ${pctRound(75+rng()*10)}% avaliação positiva de utilidade.`,
                mv: "Publicações; versões finais; registros de validação; métricas online."
              },
              {
                r: "Intercâmbios e diálogos com redes e gestores conduzidos, apoiando continuidade e escala.",
                ind: "Número de eventos ou reuniões; pessoas/instituições alcançadas; encaminhamentos formalizados.",
                meta: `≥ ${clamp(Math.round(4*sc),3,10)} eventos; alcance ≥ ${roundInt(180*sc,10)}; encaminhamentos registrados.`,
                mv: "Atas; listas; relatórios; métricas online."
              }
            ]
          }
        ];
        return { og, core };
      },

      // =================== NEW: Economia Solidária ===================
      economia_solidaria: () => {
        const people = roundInt(180*sc, 10);
        const groups = clamp(Math.round(4*sc), 2, 12);
        const knowledge = clamp(Math.round(6*sc), 4, 14);
        const reached = roundInt(140*sc, 10);

        const og = (lang==="pt")
          ? `Fortalecer cadeias locais de economia solidária em ${TERR}, ampliando capacidades de organização produtiva, comercialização e sustentabilidade econômica, conectando redes territoriais e produção de evidências ao longo de ${M} meses.`
          : (lang==="es")
            ? `Fortalecer cadenas locales de economía solidaria en ${TERR}, ampliando capacidades de organización productiva, comercialización y sostenibilidad económica, conectando redes territoriales y producción de evidencias durante ${M} meses.`
            : `Strengthen local solidarity economy value chains in ${TERR}, improving productive organization, commercialization, and economic sustainability, connecting territorial networks and evidence generation over ${M} months.`;

        const core = [
          {
            titulo: (lang==="pt")
              ? `Qualificar técnica e organizacionalmente grupos locais ${AUD}, estruturando governança interna, gestão financeira, padrões mínimos de qualidade e estratégias de comercialização solidária.`
              : (lang==="es")
                ? `Fortalecer capacidades técnicas y organizativas de grupos locales ${AUD}, estructurando gobernanza interna, gestión financiera, estándares mínimos de calidad y estrategias de comercialización solidaria.`
                : `Build technical and organizational capacity of local groups ${AUD} by strengthening internal governance, financial management, minimum quality standards, and solidarity-based commercialization strategies.`,
            resultados: [
              {
                r: "Participantes formados e aplicando rotinas de gestão, produção e qualidade, com acompanhamento estruturado.",
                ind: "Número de pessoas capacitadas; percentual que aplica rotinas; satisfação com mentorias.",
                meta: `≥ ${people} pessoas capacitadas; ≥ ${pctRound(70+rng()*10)}% aplicando rotinas; ≥ ${pctRound(80+rng()*10)}% avaliação positiva.`,
                mv: movCommon
              },
              {
                r: "Grupos e arranjos produtivos estruturados, com divisão de funções, registro de produção e inserção em canais solidários.",
                ind: "Número de grupos estruturados; percentual com melhora de renda ou estabilidade; continuidade operacional.",
                meta: `≥ ${groups} grupos estruturados e operacionais; ≥ ${pctRound(60+rng()*10)}% com melhoria comprovada de renda ou estabilidade.`,
                mv: "Registros de produção; fichas de acompanhamento; termos de adesão; evidências de comercialização."
              }
            ]
          },
          {
            titulo: (lang==="pt")
              ? "Aprimorar viabilidade econômica por meio de análise de custos, precificação, redução de perdas e melhoria de logística e comercialização."
              : (lang==="es")
                ? "Mejorar viabilidad económica mediante análisis de costos, precios, reducción de pérdidas y mejora de logística y comercialización."
                : "Improve economic viability through cost analysis, pricing, loss reduction, and improvements in logistics and commercialization.",
            resultados: [
              {
                r: "Mapa de custos e precificação implementados, com controles mínimos e tomada de decisão baseada em dados.",
                ind: "Número de linhas com custos mapeados; adoção de planilhas; variação de margem em pilotos.",
                meta: `≥ ${clamp(Math.round(8*sc),6,24)} linhas com custos mapeados; melhoria de margem demonstrada em pilotos selecionados.`,
                mv: "Planilhas; registros; relatórios; evidências de vendas."
              },
              {
                r: "Perdas e retrabalho reduzidos em processos críticos, com melhorias operacionais testadas e ajustadas.",
                ind: "Percentual de redução de perdas ou tempo; satisfação dos atores envolvidos; documentação de melhorias.",
                meta: `≥ ${pctRound(15+rng()*10)}% redução média em perdas ou tempo de processo; ≥ ${pctRound(75+rng()*10)}% avaliação positiva.`,
                mv: "Registros operacionais; relatórios de piloto; entrevistas e questionários."
              }
            ]
          },
          {
            titulo: (lang==="pt")
              ? "Produzir e disseminar conhecimento prático para replicação e políticas, incluindo guias, estudos de caso e recomendações para redes territoriais."
              : (lang==="es")
                ? "Producir y difundir conocimiento práctico para replicación y políticas, incluyendo guías, estudios de caso y recomendaciones para redes territoriales."
                : "Produce and disseminate practical knowledge for replication and policy, including guides, case studies, and recommendations for territorial networks.",
            resultados: [
              {

                ind: "Número de parcerias ativadas; número de ações integradas; satisfação de parceiros.",
                meta: `≥ ${clamp(Math.round(12*sc),6,60)} ações integradas; ≥ ${pctRound(75+rng()*10)}% avaliação positiva dos parceiros.`,

      turismo: () => {
        const businesses = clamp(Math.round(30*sc), 8, 120);

        const og = (lang==="pt")
          ? `Impulsionar turismo regenerativo em ${TERR}, fortalecendo governança, qualificação e cadeias locais, gerando renda com conservação e valorização cultural, com monitoramento e melhoria contínua ao longo de ${M} meses.`

            ? `Impulsar turismo regenerativo en ${TERR}, fortaleciendo gobernanza, capacitación y cadenas locales, generando ingresos con conservación y valorización cultural, con monitoreo y mejora continua durante ${M} meses.`

    if(!themeSets[theme]) theme = "economia_circular";
    return themeSets[theme]();
  }

  function generateFramework({tema, titulo, descricao, meses, nOE, lang, escala, editalText}){
    const seed = cyrb128(`${tema}|${titulo}|${descricao}|${meses}|${nOE}|${lang}|${escala}|${(editalText||"").slice(0,2000)}`)[0];
    const rng = mulberry32(seed);

    const ctx = guessContext(descricao, editalText, lang, rng);
    const M = clamp(parseInt(meses||36), 1, 60);
    const n = clamp(parseInt(nOE||3), 2, 5);

    const themePlan = themeBlueprint(tema, lang, ctx, M, escala, rng);

    const selected = themePlan.core.slice(0, n);

    // Fill if theme provides fewer items
    while(selected.length < n){
      selected.push((lang==="pt")
        ? {
            titulo: "Aprimorar governança, gestão de parcerias e monitoramento, assegurando execução coordenada, transparência e prestação de contas.",
            resultados: [
              {
                r: "Rotina de governança estabelecida, com responsabilidades, cadência de reuniões e registro de encaminhamentos.",
                ind: "Número de reuniões realizadas; percentual de encaminhamentos concluídos; satisfação de parceiros com coordenação.",
                meta: `≥ ${clamp(Math.round(12*scaleFactorFrom(M, escala)),8,36)} reuniões; ≥ ${pctRound(70+rng()*10)}% de encaminhamentos concluídos no prazo.`,
                mv: "Atas; listas de presença; planos de ação; questionários."
              },
              {
                r: "Sistema de monitoramento implementado com linha de base, indicadores-chave e registros mínimos para auditoria e aprendizagem.",
                ind: "Linha de base concluída; completude de registros; relatórios periódicos emitidos.",
                meta: `Linha de base até o mês ${clamp(Math.round(M*0.12),1,6)}; relatórios consistentes; registros mínimos mantidos.`,
                mv: "Planilhas de monitoramento; relatórios; evidências fotográficas; registros operacionais."
              }
            ]
          }
        : (lang==="es")
          ? {
              titulo: "Mejorar gobernanza, gestión de alianzas y monitoreo, asegurando ejecución coordinada, transparencia y rendición de cuentas.",
              resultados: [
                {
                  r: "Rutina de gobernanza establecida, con responsabilidades, cadencia de reuniones y seguimiento de acciones.",
                  ind: "Número de reuniones; porcentaje de acciones completadas; satisfacción de aliados con coordinación.",
                  meta: `≥ ${clamp(Math.round(12*scaleFactorFrom(M, escala)),8,36)} reuniones; ≥ ${pctRound(70+rng()*10)}% de acciones a tiempo.`,
                  mv: "Actas; listas de asistencia; planes de acción; encuestas."
                },
                {
                  r: "Sistema de monitoreo implementado con línea de base, indicadores y registros mínimos para auditoría y aprendizaje.",
                  ind: "Línea de base completada; completitud de registros; informes periódicos.",
                  meta: `Línea de base hasta el mes ${clamp(Math.round(M*0.12),1,6)}; informes consistentes; registros mínimos mantenidos.`,
                  mv: "Hojas de monitoreo; informes; evidencia fotográfica; registros operativos."
                }
              ]
            }
          : {
              titulo: "Improve governance, partnership management, and monitoring, ensuring coordinated delivery, transparency, and accountability.",
              resultados: [
                {
                  r: "Governance routine established with responsibilities, meeting cadence, and action tracking.",
                  ind: "Number of meetings; percentage of actions completed; partner satisfaction with coordination.",
                  meta: `≥ ${clamp(Math.round(12*scaleFactorFrom(M, escala)),8,36)} meetings; ≥ ${pctRound(70+rng()*10)}% actions completed on time.`,
                  mv: "Minutes; attendance lists; action plans; surveys."
                },
                {
                  r: "Monitoring system implemented with baseline, indicators, and minimum records for audit and learning.",
                  ind: "Baseline completed; record completeness; periodic reports.",
                  meta: `Baseline by month ${clamp(Math.round(M*0.12),1,6)}; consistent reports; minimum records maintained.`,
                  mv: "Monitoring spreadsheets; reports; photo evidence; operational records."
                }
              ]
            }
      );
    }

    // Prefix numbering R1.1 etc
    selected.forEach((oe, idx) => {
      const oeNo = idx + 1;
      oe.resultados = (oe.resultados||[]).map((r, ridx) => {
        const rn = `${oeNo}.${ridx+1}`;
        let rr = (r.r||"").replace(/^R\d+\.\d+\s+/i, "");
        rr = `R${rn} ${rr}`;
        return { ...r, r: rr };
      });
    });

    return { objetivoGeral: themePlan.og, objetivos: selected, meses: M, lang };
  }

  function renderTable(fr){
    const H = HEADERS[fr.lang] || HEADERS.pt;
    const tbl = document.getElementById("tbl");
    tbl.innerHTML = "";

    tbl.innerHTML += `
      <tr>
        <td class="col-obj">${H.og}</td>
        <td colspan="4">${fr.objetivoGeral}</td>
      </tr>
    `;

    fr.objetivos.forEach((oe, idx) => {
      const oeNo = idx + 1;
      tbl.innerHTML += `
        <tr>
          <td class="col-obj">${H.oe} ${oeNo}</td>
          <td colspan="4" class="oeTitle">${oe.titulo}</td>
        </tr>
        <tr>
          <th></th>
          <th>${H.resultados}</th>
          <th>${H.indicadores}</th>
          <th>${H.meta}</th>
          <th>${H.mov}</th>
        </tr>
      `;
      (oe.resultados||[]).forEach(r => {
        tbl.innerHTML += `
          <tr>
            <td></td>
            <td>${r.r}</td>
            <td>${r.ind}</td>
            <td>${r.meta}</td>
            <td>${r.mv}</td>
          </tr>
        `;
      });
    });
  }

  function buildSheetAoA(fr){
    const H = HEADERS[fr.lang] || HEADERS.pt;
    const aoa = [];
    const merges = [];

    aoa.push([H.og, fr.objetivoGeral, "", "", ""]);
    merges.push({ s:{r:0,c:1}, e:{r:0,c:4} });

    let r = 1;
    fr.objetivos.forEach((oe, idx) => {
      const oeNo = idx + 1;
      aoa.push([`${H.oe} ${oeNo}`, oe.titulo, "", "", ""]);
      merges.push({ s:{r:r,c:1}, e:{r:r,c:4} });
      r++;

      aoa.push(["", H.resultados, H.indicadores, H.meta, H.mov]);
      r++;

      (oe.resultados||[]).forEach(res => {
        aoa.push(["", res.r, res.ind, res.meta, res.mv]);
        r++;
      });
    });

    return { aoa, merges };
  }

  function downloadXlsx(fr, projectTitle){
    const { aoa, merges } = buildSheetAoA(fr);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!merges"] = merges;
    ws["!cols"] = [
      { wch: 24 },
      { wch: 54 },
      { wch: 46 },
      { wch: 34 },
      { wch: 46 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Marco Lógico");

    const safe = (projectTitle || "marco_logico")
      .replace(/[^a-zA-Z0-9]+/g, "_")
      .replace(/^_+|_+$/g,"")
      .slice(0,40);

    XLSX.writeFile(wb, `Marco_Logico_${safe}.xlsx`);
  }

  // Wiring
  const frm = document.getElementById("frm");
  const statusEl = document.getElementById("status");
  const previewBox = document.getElementById("previewBox");
  const baixarBtn = document.getElementById("baixarXlsx");

  let lastFramework = null;

  frm.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.className = "status";
    statusEl.textContent = "Processando…";

    try{
      const titulo = clean(document.getElementById("titulo").value);
      const descricao = clean(document.getElementById("descricao").value);
      const meses = parseInt(document.getElementById("meses").value||0);
      const nOE = parseInt(document.getElementById("nOE").value||0);
      const lang = document.getElementById("lang").value || "pt";
      const tema = document.getElementById("tema").value;
      const escala = document.getElementById("escala").value || "padrao";

      if(!titulo || !descricao) throw new Error("Preencha título e descrição.");
      if(!meses || meses<1 || meses>60) throw new Error("Duração deve estar entre 1 e 60 meses.");
      if(!nOE || nOE<2 || nOE>5) throw new Error("Número de objetivos específicos deve estar entre 2 e 5.");

      const file = document.getElementById("edital").files?.[0];
      const editalText = clean(await readFileText(file));

      const fr = generateFramework({tema, titulo, descricao, meses, nOE, lang, escala, editalText});
      lastFramework = fr;

      renderTable(fr);
      previewBox.style.display = "block";

      statusEl.textContent = "✓ Quadro gerado";
      statusEl.classList.add("success");
    }catch(err){
      statusEl.textContent = "Erro: " + (err.message || String(err));
      statusEl.classList.add("error");
      previewBox.style.display = "none";
      lastFramework = null;
    }
  });

  baixarBtn.addEventListener("click", () => {
    if(!lastFramework) return;
    const titulo = clean(document.getElementById("titulo").value);
    downloadXlsx(lastFramework, titulo);
  });
</script>
