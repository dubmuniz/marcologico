<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Marco Lógico — Saída em Tabela</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f3f3f3;
      --table:#e6e6e6;
      --head:#d9d9d9;
      --line:#bfbfbf;
      --ink:#1b1b1b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background:#fafafa;
      color:var(--ink);
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
    }
    h1{
      margin:0 0 12px;
      font-size:24px;
    }
    form{
      background:#fff;
      border:1px solid #ddd;
      border-radius:8px;
      padding:16px;
      margin-bottom:20px;
    }
    label{
      display:block;
      font-weight:600;
      margin:12px 0 6px;
    }
    input, textarea, select{
      width:100%;
      border:1px solid #ccc;
      border-radius:6px;
      padding:8px;
      font:inherit;
    }
    textarea{min-height:90px}
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    button{
      margin-top:16px;
      padding:10px 16px;
      font-weight:600;
      border:0;
      border-radius:6px;
      background:#1E7E34;
      color:#fff;
      cursor:pointer;
    }
    .table-wrap{
      overflow:auto;
      background:#fff;
      border:1px solid #ccc;
    }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
      background:var(--table);
    }
    th, td{
      border:1px solid var(--line);
      padding:8px 10px;
      vertical-align:top;
    }
    th{
      background:var(--head);
      font-weight:600;
      text-align:left;
    }
    .col-obj{
      width:220px;
      font-weight:600;
      background:var(--head);
    }
    .muted{
      font-size:12px;
      color:#555;
      margin-top:6px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Gerador de Marco Lógico</h1>

  <form id="frm">
    <label>Objetivo Geral</label>
    <textarea id="objGeral" required></textarea>

    <div class="row">
      <div>
        <label>Duração do projeto, em meses</label>
        <input type="number" id="duracao" min="1" max="60" value="12" required>
        <div class="muted">A duração é exibida nas metas, não altera atividades.</div>
      </div>
      <div>
        <label>Número de Objetivos Específicos</label>
        <select id="nOE">
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      </div>
    </div>

    <div id="oes"></div>

    <button type="submit">Gerar Tabela</button>
  </form>

  <div class="table-wrap" id="out" style="display:none">
    <table id="tbl"></table>
  </div>
</div>

<script>
  const oesDiv = document.getElementById("oes");
  const nOE = document.getElementById("nOE");

  function renderOEInputs(){
    oesDiv.innerHTML="";
    const n = parseInt(nOE.value);
    for(let i=1;i<=n;i++){
      const div=document.createElement("div");
      div.innerHTML=`
        <label>Objetivo Específico ${i}</label>
        <textarea id="oe_${i}" required></textarea>

        <table style="margin-top:8px;width:100%;border-collapse:collapse">
          <tr>
            <th>Resultados</th>
            <th>Indicadores</th>
            <th>Meta</th>
            <th>Meios de Verificação</th>
          </tr>
          <tr>
            <td><textarea id="r_${i}_1"></textarea></td>
            <td><textarea id="ind_${i}_1"></textarea></td>
            <td><textarea id="meta_${i}_1"></textarea></td>
            <td><textarea id="mv_${i}_1"></textarea></td>
          </tr>
          <tr>
            <td><textarea id="r_${i}_2"></textarea></td>
            <td><textarea id="ind_${i}_2"></textarea></td>
            <td><textarea id="meta_${i}_2"></textarea></td>
            <td><textarea id="mv_${i}_2"></textarea></td>
          </tr>
          <tr>
            <td><textarea id="r_${i}_3"></textarea></td>
            <td><textarea id="ind_${i}_3"></textarea></td>
            <td><textarea id="meta_${i}_3"></textarea></td>
            <td><textarea id="mv_${i}_3"></textarea></td>
          </tr>
        </table>
      `;
      oesDiv.appendChild(div);
    }
  }
  nOE.addEventListener("change", renderOEInputs);
  renderOEInputs();

  document.getElementById("frm").addEventListener("submit", e=>{
    e.preventDefault();
    const tbl=document.getElementById("tbl");
    tbl.innerHTML="";

    const dur=document.getElementById("duracao").value;
    const og=document.getElementById("objGeral").value;

    // Objetivo Geral
    tbl.innerHTML+=`
      <tr>
        <td class="col-obj">Objetivo Geral</td>
        <td colspan="4">${og}</td>
      </tr>
    `;

    const n=parseInt(nOE.value);
    for(let i=1;i<=n;i++){
      const oe=document.getElementById(`oe_${i}`).value;

      tbl.innerHTML+=`
        <tr>
          <td class="col-obj">Objetivo Específico ${i}</td>
          <td colspan="4"><em>${oe}</em></td>
        </tr>
        <tr>
          <th></th>
          <th>Resultados</th>
          <th>Indicadores</th>
          <th>Meta</th>
          <th>Meios de Verificação</th>
        </tr>
      `;

      for(let j=1;j<=3;j++){
        const r=document.getElementById(`r_${i}_${j}`).value;
        const ind=document.getElementById(`ind_${i}_${j}`).value;
        const meta=document.getElementById(`meta_${i}_${j}`).value;
        const mv=document.getElementById(`mv_${i}_${j}`).value;

        if(!r && !ind && !meta && !mv) continue;

        tbl.innerHTML+=`
          <tr>
            <td></td>
            <td>${r}</td>
            <td>${ind}</td>
            <td>${meta.replace(/\{meses\}/g,dur)}</td>
            <td>${mv}</td>
          </tr>
        `;
      }
    }

    document.getElementById("out").style.display="block";
  });
</script>
</body>
</html>
